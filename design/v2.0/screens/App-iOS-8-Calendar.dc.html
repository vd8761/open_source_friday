<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App — Calendar (month)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; color: #10222B; background-color: #F4F7F9; background-image: linear-gradient(rgba(16,34,43,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(16,34,43,0.04) 1px, transparent 1px); background-size: 40px 40px">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: {{top}}px 20px 16px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: center; justify-content: space-between; padding-top: 8px">
      <h1 style="margin: 0; font-weight: 600; font-size: 32px; letter-spacing: -0.02em">Calendar</h1>
      <div role="group" aria-label="View" style="display: flex; padding: 4px; border-radius: 999px; background: #FFFFFF; border: 1px solid #DCE3E7">
        <span aria-current="page" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 10px 14px; border-radius: 999px; background: #10222B; color: #FFFFFF">MONTH</span>
        <a href="{{l.agenda}}" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 10px 14px; border-radius: 999px; color: #5B6F79; text-decoration: none">WEEK</a>
      </div>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #DCE3E7; border-radius: 24px; padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
        <button type="button" aria-label="Previous month" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #DCE3E7; background: #FFFFFF; color: #10222B; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
        </button>
        <span style="font-weight: 600; font-size: 18px">October 2026</span>
        <button type="button" aria-label="Next month" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #DCE3E7; background: #FFFFFF; color: #10222B; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5B6F79">
        <span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span style="color: #2F8A36; font-weight: 700">FRI</span><span>SAT</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px 4px; justify-items: center">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
          <sc-if value="{{c.blank}}" hint-placeholder-val="{{ false }}">
            <span style="width: 40px; height: 40px"></span>
          </sc-if>
          <sc-if value="{{c.plain}}" hint-placeholder-val="{{ true }}">
            <span style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; background: #F4F7F9; color: {{c.fg}}; border: {{c.border}}; box-sizing: border-box">{{c.d}}</span>
          </sc-if>
          <sc-if value="{{c.ep}}" hint-placeholder-val="{{ false }}">
            <button type="button" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; background: {{c.bg}}; color: #FFFFFF; border: 0; box-shadow: {{c.ring}}; cursor: pointer">{{c.d}}</button>
          </sc-if>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 10px 14px; padding: 10px 4px 0; border-top: 1px solid #EEF2F5; font-size: 12px; color: #5B6F79">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #6E5BC7"></span>AI Engineer</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #1593C3"></span>Cloud</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #C77A12"></span>Open Source</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 50%; background: #2F8A36"></span>Digital Skills</span>
      </div>
    </div>

    <!-- Selected episode -->
    <a href="{{l.event}}" style="display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 22px; background: {{sel.cardBg}}; color: {{sel.cardFg}}; text-decoration: none; border: 1px solid {{sel.cardBorder}}">
      <span style="flex: none; width: 56px; height: 62px; border-radius: 14px; background: {{sel.color}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05"><span style="font-weight: 600; font-size: 24px">{{sel.d}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px">OCT</span></span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: {{sel.metaFg}}">EP {{sel.n}} · {{sel.status}}</span>
        <span style="font-weight: 600; font-size: 16px; line-height: 1.25">{{sel.t}}</span>
        <span style="font-size: 13px; color: {{sel.metaFg}}">{{sel.s}} · 7–8 PM IST</span>
      </span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 18l6-6-6-6"></path></svg>
    </a>
  </div>

  <dc-import name="App-TabBar" platform="{{platform}}" active="cal" hint-size="100%,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 30 };
  }
  renderVals() {
    const and = this.props.platform === 'android';
    const P = and ? 'App-And-' : 'App-iOS-';
    const l = { agenda: P + '9-Agenda.dc.html', event: P + '10-Event.dc.html' };
    const eps = {
      2: { n: 12, t: 'Behind the AI Prompt: Autonomous AI Agents & Breaking LLMs', s: 'Dr. Jayaprakash Natarajan', color: '#6E5BC7', status: 'COMPLETED' },
      9: { n: 13, t: 'How Code Actually Reaches Production', s: 'Arumugam V', color: '#1593C3', status: 'COMPLETED' },
      16: { n: 14, t: 'Agile Methodology in Real-World Engineering', s: 'Arumugam V', color: '#2F8A36', status: 'COMPLETED' },
      23: { n: 15, t: 'Niche & High-Growth Technical Domains', s: 'Selvaganapathi R.', color: '#2F8A36', status: 'COMPLETED' },
      30: { n: 16, t: 'Resume Masterclass: Bypass HR Rejections', s: 'Selvaganapathi R.', color: '#2F8A36', status: 'UPCOMING · REMINDER ON' }
    };
    const cells = [];
    for (let i = 0; i < 4; i++) cells.push({ blank: true });
    for (let d = 1; d <= 31; d++) {
      const e = eps[d];
      if (e) {
        const on = this.state.sel === d;
        cells.push({ ep: true, d, bg: e.color, aria: 'EP ' + e.n + ', ' + d + ' October', pressed: on ? 'true' : 'false', ring: on ? '0 0 0 3px #F4F7F9, 0 0 0 5px ' + e.color : 'none', pick: () => this.setState({ sel: d }) });
      } else {
        const today = d === 29;
        cells.push({ plain: true, d, fg: today ? '#10222B' : (d < 29 ? '#93AAB5' : '#10222B'), border: today ? '2px solid #10222B' : '0' });
      }
    }
    const e = eps[this.state.sel] || eps[30];
    const up = this.state.sel === 30;
    const sel = { ...e, d: String(this.state.sel).padStart(2, '0'), cardBg: up ? '#0C3346' : '#FFFFFF', cardFg: up ? '#FFFFFF' : '#10222B', cardBorder: up ? '#0C3346' : '#DCE3E7', metaFg: up ? '#C9D8DF' : '#5B6F79' };
    return { platform: and ? 'android' : 'ios', w: and ? 412 : 390, h: and ? 915 : 844, top: and ? 32 : 54, l, cells, sel };
  }
}
</script>
</body>
</html>
