<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top navigation — OSF</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: 'Space Grotesk', system-ui, sans-serif; color: #10222B; background: rgba(255,255,255,0.92); border-bottom: 1px solid #DCE3E7">
  <nav aria-label="Main" style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px">
    <a href="Main.dc.html" aria-label="Open Source Fridays — home" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #10222B">
      <img src="../assets/dos_logo.png" alt="Descience Open Source Club" style="height: 42px; width: auto; display: block">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; padding: 5px 9px; border-radius: 999px; background: #E7F3E8; color: #2F8A36">OSF</span>
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 2px">
      <sc-for list="{{links}}" as="l" hint-placeholder-count="4">
        <sc-if value="{{l.on}}" hint-placeholder-val="{{ false }}">
          <a href="{{l.href}}" aria-current="page" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #2F8A36; text-decoration: none; padding: 12px 12px; border-bottom: 2px solid #2F8A36">{{l.label}}</a>
        </sc-if>
        <sc-if value="{{l.off}}" hint-placeholder-val="{{ true }}">
          <a href="{{l.href}}" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #10222B; text-decoration: none; padding: 12px 12px; border-bottom: 2px solid transparent">{{l.label}}</a>
        </sc-if>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
      <a href="https://descienceosclub.com/" target="_blank" rel="noopener" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #10222B; text-decoration: none; padding: 12px 16px; border-radius: 999px; border: 1px solid #CFD9DE">DOS CLUB ↗</a>
      <a href="Register-1.dc.html" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: #FFFFFF; background: #2F8A36; text-decoration: none; padding: 13px 18px; border-radius: 999px">REGISTER -&gt;</a>
    </div>
  </nav>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","episodes","speakers","who","speak","none"],"default":"home"},"$preview":{"width":1440,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || 'home';
    const items = [
      { id: 'episodes', label: 'Episodes', href: 'Episodes.dc.html' },
      { id: 'speakers', label: 'Speakers', href: 'Speakers.dc.html' },
      { id: 'who', label: "Who it's for", href: 'Who.dc.html' },
      { id: 'speak', label: 'Speak at OSF', href: 'Speak.dc.html' }
    ];
    return { links: items.map((i) => ({ ...i, on: i.id === active, off: i.id !== active })) };
  }
}
</script>
</body>
</html>
