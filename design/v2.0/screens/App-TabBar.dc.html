<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App — Bottom tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="font-family: 'Space Grotesk', system-ui, sans-serif; color: #10222B; width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.96); border-top: 1px solid #DCE3E7; display: flex; padding: {{pad}}">
  <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
    <a href="{{t.href}}" aria-label="{{t.label}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{t.color}}; min-height: 44px; padding-top: 2px">
      <span style="display: flex; align-items: center; justify-content: center; width: {{t.pillW}}; height: 32px; border-radius: 999px; background: {{t.pillBg}}">
        <sc-if value="{{t.isHome}}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>
        </sc-if>
        <sc-if value="{{t.isCal}}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        </sc-if>
        <sc-if value="{{t.isTips}}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V16h5v-.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3z"></path></svg>
        </sc-if>
        <sc-if value="{{t.isMine}}" hint-placeholder-val="{{ false }}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.stroke}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg>
        </sc-if>
      </span>
      <span style="font-size: {{fs}}; font-weight: {{t.weight}}; letter-spacing: 0.01em">{{t.label}}</span>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"active":{"editor":"enum","options":["home","cal","tips","mine","none"],"default":"home"},"$preview":{"width":390,"height":83}}'>
class Component extends DCLogic {
  renderVals() {
    const and = this.props.platform === 'android';
    const active = this.props.active || 'home';
    const P = and ? 'App-And-' : 'App-iOS-';
    const defs = [
      { id: 'home', label: 'Home', href: P + '7-Home.dc.html' },
      { id: 'cal', label: 'Calendar', href: P + '8-Calendar.dc.html' },
      { id: 'tips', label: 'Tips', href: P + '12-Tips.dc.html' },
      { id: 'mine', label: 'My Fridays', href: P + '11-MyFridays.dc.html' }
    ];
    const tabs = defs.map((d) => {
      const on = d.id === active;
      return {
        ...d,
        isHome: d.id === 'home', isCal: d.id === 'cal', isTips: d.id === 'tips', isMine: d.id === 'mine',
        color: on ? (and ? '#10222B' : '#2F8A36') : '#5B6F79',
        weight: on ? '700' : '500',
        stroke: on ? '2.2' : '1.8',
        pillW: and ? '64px' : '32px',
        pillBg: and && on ? '#D3EBD5' : 'transparent'
      };
    });
    return { tabs, pad: and ? '12px 8px 28px' : '8px 8px 30px', fs: and ? '12px' : '11px' };
  }
}
</script>
</body>
</html>
