<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App — Tips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}px; height: {{h}}px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; font-family: 'Space Grotesk', system-ui, sans-serif; color: #10222B; background-color: #F4F7F9; background-image: linear-gradient(rgba(16,34,43,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(16,34,43,0.04) 1px, transparent 1px); background-size: 40px 40px">

  <div style="flex: 1; min-height: 0; overflow: hidden; padding: {{top}}px 20px 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px; padding-top: 8px">
      <h1 style="margin: 0; font-weight: 600; font-size: 32px; letter-spacing: -0.02em">Tips</h1>
      <span style="font-size: 14px; color: #5B6F79">Short, useful, straight from our speakers.</span>
    </div>

    <div role="group" aria-label="Filter tips" style="display: flex; gap: 8px; overflow: hidden">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="flex: none; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; cursor: pointer">{{f.label}}</button>
      </sc-for>
    </div>

    <!-- Featured -->
    <div style="border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; color: #FFFFFF; background-color: #0C3346; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 32px 32px">
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #8BD08E">TIP OF THE WEEK</span><span style="font-weight: 700; font-size: 38px; line-height: 0.6; color: #8BD08E">“</span></div>
      <p style="margin: 0; font-weight: 300; font-size: 21px; line-height: 1.3">Map your actual skills and projects — don't lean on a rigid placement template.</p>
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: #93AAB5">EP 16 · SELVAGANAPATHI R.</span><button type="button" aria-label="Save tip" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid #3A5F70; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg></button></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{tips}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #FFFFFF; border: 1px solid #DCE3E7">
          <span style="flex: none; width: 4px; border-radius: 999px; background: {{t.color}}"></span>
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: #5B6F79">{{t.meta}}</span>
            <span style="font-size: 15px; line-height: 1.4">{{t.text}}</span>
          </span>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 18px; border: 1px dashed #1593C3; background: #E3F1F8; color: #0D5A78">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="2" y="5" width="20" height="14" rx="3"></rect><path d="M10 9l5 3-5 3z"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 600; font-size: 15px">Tech videos — coming soon</span><span style="font-size: 13px">Short clips and episode recaps, right here.</span></span>
    </div>
  </div>

  <dc-import name="App-TabBar" platform="{{platform}}" active="tips" hint-size="100%,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"platform":{"editor":"enum","options":["ios","android"],"default":"ios"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { f: 'ALL' };
  }
  renderVals() {
    const and = this.props.platform === 'android';
    const all = [
      { d: 'CLOUD', color: '#1593C3', meta: 'EP 13 · CLOUD', text: "Learn what happens after you push — CI, reviews and deploys are part of the job, not someone else's." },
      { d: 'AI', color: '#6E5BC7', meta: 'EP 12 · AI ENGINEER', text: 'Agents are architecture, not just prompts. Know how they call tools — and where LLMs break.' },
      { d: 'CAREERS', color: '#2F8A36', meta: 'EP 10 · DIGITAL SKILLS', text: "Placements aren't the only path. Test one small idea of your own this month." },
      { d: 'AI', color: '#6E5BC7', meta: 'EP 2 · AI ENGINEER', text: 'Pick GPU compute for the project, not the hype — match it to your workload and budget.' }
    ];
    const opts = ['ALL', 'CAREERS', 'AI', 'CLOUD', 'SAVED'];
    const filters = opts.map((o) => { const on = this.state.f === o; return { label: o, pressed: on ? 'true' : 'false', bg: on ? '#10222B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#10222B', border: on ? '#10222B' : '#CFD9DE', pick: () => this.setState({ f: o }) }; });
    const tips = this.state.f === 'ALL' ? all : all.filter((t) => t.d === this.state.f);
    return { platform: and ? 'android' : 'ios', w: and ? 412 : 390, h: and ? 915 : 844, top: and ? 32 : 54, filters, tips };
  }
}
</script>
</body>
</html>
